<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>King Electronics – Lucknow ka No.1 Electronics Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --red:#E8001C;--red-dark:#b80016;--red-light:#ff1a35;
    --black:#0a0a0a;--dark:#111;--dark2:#1a1a1a;
    --gray:#6b7280;--gray-light:#f3f4f6;--gray-mid:#e5e7eb;
    --white:#fff;--gold:#f59e0b;
    --font-display:'Rajdhani',sans-serif;
    --font-body:'DM Sans',sans-serif;
  }
  html{scroll-behavior:smooth}
  body{font-family:var(--font-body);background:#fff;color:var(--black);overflow-x:hidden}
  .rajdhani{font-family:var(--font-display)}
  input,select,textarea,button{font-family:var(--font-body)}

  /* Scrollbar */
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:#f1f1f1}
  ::-webkit-scrollbar-thumb{background:var(--red);border-radius:3px}

  /* Animations */
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .fade-up{animation:fadeUp .5s ease forwards}
  .pulse{animation:pulse 2s infinite}

  /* Top bar */
  .topbar{background:var(--black);color:#ccc;font-size:12px;padding:6px 0}
  .topbar-inner{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .topbar a{color:#ccc;text-decoration:none}
  .topbar a:hover{color:var(--red)}
  .topbar-left,.topbar-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

  /* Header */
  .header{background:#fff;border-bottom:1px solid var(--gray-mid);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .header-inner{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
  .logo-crown{width:36px;height:36px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .logo-text{line-height:1}
  .logo-name{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--red);letter-spacing:1px}
  .logo-tag{font-size:10px;color:var(--gray);font-weight:500}
  .search-wrap{flex:1;display:flex;max-width:560px;margin:0 auto}
  .search-input{flex:1;border:2px solid var(--gray-mid);border-right:none;border-radius:8px 0 0 8px;padding:10px 16px;font-size:14px;outline:none;transition:.2s}
  .search-input:focus{border-color:var(--red)}
  .search-cat{border:2px solid var(--gray-mid);border-left:1px solid var(--gray-mid);border-right:none;padding:10px 12px;font-size:13px;background:#f9f9f9;cursor:pointer;outline:none}
  .search-btn{background:var(--red);color:#fff;border:none;padding:10px 18px;border-radius:0 8px 8px 0;cursor:pointer;font-size:16px;transition:.2s}
  .search-btn:hover{background:var(--red-dark)}
  .header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .wa-btn-header{display:flex;align-items:center;gap:6px;background:#25D366;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
  .cart-btn{position:relative;background:none;border:none;cursor:pointer;font-size:22px;padding:4px}
  .cart-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}

  /* Nav */
  .nav{background:var(--red)}
  .nav-inner{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:0}
  .nav-all{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);color:#fff;padding:12px 20px;font-weight:600;font-size:14px;cursor:pointer;border:none;white-space:nowrap}
  .nav-link{color:#fff;text-decoration:none;padding:12px 16px;font-size:14px;font-weight:500;display:block;transition:.2s;white-space:nowrap}
  .nav-link:hover{background:rgba(0,0,0,.15)}
  .nav-deals{background:var(--gold);color:var(--black)!important;border-radius:4px;font-weight:700}

  /* Hero */
  .hero{background:linear-gradient(135deg,#0a0a0a 0%,#1a0005 50%,#0a0a0a 100%);color:#fff;padding:60px 16px;position:relative;overflow:hidden;min-height:420px;display:flex;align-items:center}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%,rgba(232,0,28,.15) 0%,transparent 70%)}
  .hero-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;width:100%;position:relative;z-index:1}
  .hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(232,0,28,.2);border:1px solid rgba(232,0,28,.4);color:var(--red-light);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.5px;margin-bottom:16px}
  .hero-h1{font-family:var(--font-display);font-size:clamp(32px,5vw,58px);font-weight:700;line-height:1.05;margin-bottom:8px}
  .hero-h1 span{color:var(--red-light)}
  .hero-sub{font-size:15px;color:#aaa;margin-bottom:24px;line-height:1.5}
  .hero-trust{display:flex;gap:20px;margin-bottom:28px;flex-wrap:wrap}
  .hero-trust-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#ccc}
  .hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
  .btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;padding:13px 24px;border-radius:8px;font-weight:700;font-size:15px;border:none;cursor:pointer;text-decoration:none;transition:.2s}
  .btn-primary:hover{background:var(--red-dark);transform:translateY(-1px)}
  .btn-wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;padding:13px 24px;border-radius:8px;font-weight:700;font-size:15px;border:none;cursor:pointer;text-decoration:none;transition:.2s}
  .btn-wa:hover{background:#128C7E;transform:translateY(-1px)}
  .hero-img-wrap{position:relative;display:flex;align-items:center;justify-content:center}
  .hero-circle{width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(232,0,28,.2) 0%,transparent 70%);border:1px solid rgba(232,0,28,.3);display:flex;align-items:center;justify-content:center;animation:float 4s ease-in-out infinite}
  .hero-products{display:flex;gap:16px;align-items:center}
  .hero-product-img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(232,0,28,.3))}
  .hero-badge-corner{position:absolute;bottom:16px;right:0;background:var(--red);color:#fff;padding:10px 16px;border-radius:12px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:13px;line-height:1.2}

  /* Trust strip */
  .trust-strip{background:#fff;border-bottom:1px solid var(--gray-mid);padding:16px 0}
  .trust-inner{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .trust-item{display:flex;align-items:center;gap:10px;font-size:13px}
  .trust-icon{width:36px;height:36px;border-radius:8px;background:rgba(232,0,28,.08);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .trust-text strong{display:block;font-weight:600;font-size:13px}
  .trust-text span{color:var(--gray);font-size:11px}

  /* Section */
  .section{padding:48px 16px}
  .section-inner{max-width:1280px;margin:0 auto}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .section-title{font-family:var(--font-display);font-size:28px;font-weight:700}
  .section-title span{color:var(--red)}
  .view-all{color:var(--red);text-decoration:none;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px}
  .view-all:hover{text-decoration:underline}

  /* Category cards */
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .cat-card{border-radius:16px;overflow:hidden;position:relative;cursor:pointer;aspect-ratio:3/2;display:flex;align-items:flex-end;transition:.3s}
  .cat-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.15)}
  .cat-card-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px}
  .cat-card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 60%)}
  .cat-card-content{position:relative;z-index:1;padding:16px;color:#fff;width:100%}
  .cat-card-name{font-family:var(--font-display);font-size:20px;font-weight:700}
  .cat-card-tag{font-size:11px;color:#ccc;margin-bottom:8px}
  .cat-explore{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600}
  .cat-ac{background:linear-gradient(135deg,#0066cc,#003d7a)}
  .cat-fridge{background:linear-gradient(135deg,#166534,#052e16)}
  .cat-tv{background:linear-gradient(135deg,#7c2d12,#431407)}
  .cat-appliances{background:linear-gradient(135deg,#581c87,#2e1065)}

  /* Product card */
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
  .product-card{border:1px solid var(--gray-mid);border-radius:12px;overflow:hidden;background:#fff;transition:.3s;cursor:pointer}
  .product-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.12);transform:translateY(-4px);border-color:var(--red)}
  .product-card-img{height:180px;background:var(--gray-light);display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;overflow:hidden}
  .product-badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px}
  .product-badge-type{position:absolute;top:8px;right:8px;background:var(--black);color:#fff;font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px}
  .product-card-body{padding:14px}
  .product-card-name{font-weight:600;font-size:14px;line-height:1.4;margin-bottom:6px;color:var(--black)}
  .product-rating{display:flex;align-items:center;gap:4px;margin-bottom:8px}
  .stars{color:var(--gold);font-size:12px}
  .rating-count{font-size:11px;color:var(--gray)}
  .product-price{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
  .price-current{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--red)}
  .price-mrp{font-size:13px;color:var(--gray);text-decoration:line-through}
  .price-off{font-size:12px;color:#16a34a;font-weight:700}
  .product-card-actions{display:flex;gap:6px;margin-top:10px}
  .btn-call{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:2px solid var(--red);color:var(--red);background:#fff;padding:8px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
  .btn-call:hover{background:var(--red);color:#fff}
  .btn-wa-sm{display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:#25D366;color:#fff;border-radius:7px;border:none;cursor:pointer;font-size:16px;transition:.2s;flex-shrink:0}
  .btn-wa-sm:hover{background:#128C7E}

  /* WhatsApp banner */
  .wa-banner{background:linear-gradient(135deg,#075E54,#128C7E);color:#fff;padding:48px 16px;position:relative;overflow:hidden}
  .wa-banner::before{content:'';position:absolute;right:-80px;top:-80px;width:300px;height:300px;background:rgba(255,255,255,.05);border-radius:50%}
  .wa-banner-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
  .wa-banner-title{font-family:var(--font-display);font-size:clamp(24px,4vw,40px);font-weight:700;margin-bottom:8px}
  .wa-banner-title span{color:#25D366}
  .wa-banner-sub{font-size:14px;color:rgba(255,255,255,.8);margin-bottom:24px}
  .wa-join-btn{display:inline-flex;align-items:center;gap:10px;background:#25D366;color:#fff;padding:14px 28px;border-radius:10px;font-weight:700;font-size:16px;text-decoration:none;transition:.2s;border:none;cursor:pointer}
  .wa-join-btn:hover{background:#1ebe59;transform:scale(1.02)}
  .wa-phone-mock{background:rgba(255,255,255,.1);border-radius:16px;padding:16px;width:240px;font-size:12px}
  .wa-msg{background:#fff;color:#111;padding:10px 14px;border-radius:10px 10px 10px 2px;font-size:12px;margin-bottom:8px;line-height:1.4}
  .wa-msg-reply{background:#dcf8c6;color:#111;padding:10px 14px;border-radius:10px 10px 2px 10px;font-size:12px;text-align:right}

  /* Local banner */
  .local-banner{background:linear-gradient(135deg,var(--black),#1a1a2e);color:#fff;padding:40px 16px;text-align:center}
  .local-banner-inner{max-width:1280px;margin:0 auto}
  .local-banner-title{font-family:var(--font-display);font-size:clamp(20px,3vw,34px);font-weight:700;margin-bottom:8px}
  .local-banner-title span{color:var(--red-light)}
  .local-features{display:flex;justify-content:center;gap:40px;margin-top:24px;flex-wrap:wrap}
  .local-feature{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:#ccc}
  .local-feature strong{color:#fff;font-size:14px}

  /* Footer */
  .footer{background:var(--black);color:#ccc;padding:40px 16px 0}
  .footer-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:32px}
  .footer-brand{}
  .footer-logo-text{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--red);margin-bottom:8px}
  .footer-desc{font-size:13px;line-height:1.6;color:#999;margin-bottom:16px}
  .footer-socials{display:flex;gap:10px}
  .social-btn{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:.2s;text-decoration:none;color:#fff}
  .social-btn:hover{background:var(--red)}
  .footer-h{font-family:var(--font-display);font-size:15px;font-weight:700;color:#fff;margin-bottom:14px}
  .footer-links{list-style:none;display:flex;flex-direction:column;gap:8px}
  .footer-links a{color:#999;text-decoration:none;font-size:13px;transition:.2s}
  .footer-links a:hover{color:var(--red)}
  .footer-contact-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#999;margin-bottom:10px}
  .footer-subscribe{display:flex;gap:0;margin-top:12px}
  .footer-email{flex:1;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;padding:9px 12px;border-radius:6px 0 0 6px;font-size:13px;outline:none}
  .footer-sub-btn{background:var(--red);color:#fff;border:none;padding:9px 14px;border-radius:0 6px 6px 0;cursor:pointer;font-size:14px}
  .footer-bottom{border-top:1px solid rgba(255,255,255,.08);margin-top:32px;padding:16px 0;text-align:center;font-size:12px;color:#555}

  /* Product detail */
  .pd-wrap{max-width:1280px;margin:0 auto;padding:24px 16px}
  .breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gray);margin-bottom:20px;flex-wrap:wrap}
  .breadcrumb a{color:var(--gray);text-decoration:none}
  .breadcrumb a:hover{color:var(--red)}
  .breadcrumb-sep{color:var(--gray-mid)}
  .pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .pd-gallery{}
  .pd-main-img{background:var(--gray-light);border-radius:12px;height:400px;display:flex;align-items:center;justify-content:center;font-size:120px;position:relative;margin-bottom:12px;border:1px solid var(--gray-mid)}
  .pd-thumbnails{display:flex;gap:8px}
  .pd-thumb{width:72px;height:72px;border-radius:8px;border:2px solid var(--gray-mid);background:var(--gray-light);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:.2s}
  .pd-thumb.active,.pd-thumb:hover{border-color:var(--red)}
  .pd-info{}
  .pd-brand{font-size:18px;font-weight:700;color:#003087;margin-bottom:6px}
  .pd-title{font-family:var(--font-display);font-size:clamp(20px,3vw,28px);font-weight:700;line-height:1.2;margin-bottom:10px}
  .pd-rating-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .pd-rating-badge{background:var(--gold);color:#fff;padding:3px 8px;border-radius:4px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
  .pd-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .pd-tag{background:var(--gray-light);border:1px solid var(--gray-mid);color:var(--black);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500}
  .pd-price-row{margin-bottom:8px}
  .pd-price-current{font-family:var(--font-display);font-size:36px;font-weight:700;color:var(--red)}
  .pd-price-mrp{font-size:16px;color:var(--gray);text-decoration:line-through;margin-left:10px}
  .pd-price-off{font-size:14px;color:#16a34a;font-weight:700;margin-left:6px}
  .pd-tax{font-size:12px;color:var(--gray);margin-bottom:14px}
  .pd-best-price{background:rgba(232,0,28,.06);border:1px solid rgba(232,0,28,.2);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--red)}
  .pd-best-price strong{display:block;font-size:14px}
  .pd-delivery{display:flex;align-items:center;gap:8px;background:var(--gray-light);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px}
  .pd-features{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
  .pd-feature{text-align:center;padding:10px;background:var(--gray-light);border-radius:8px;font-size:11px;color:var(--gray)}
  .pd-feature strong{display:block;font-size:12px;color:var(--black);margin-bottom:2px}
  .pd-cta-primary{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;border:none;padding:15px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;transition:.2s;margin-bottom:10px}
  .pd-cta-primary:hover{background:#128C7E}
  .pd-cta-secondary{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:var(--black);border:2px solid var(--gray-mid);padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
  .pd-cta-secondary:hover{border-color:var(--red);color:var(--red)}
  .pd-offers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0}
  .pd-offer{border:1px solid var(--gray-mid);border-radius:8px;padding:10px;font-size:11px;color:var(--black);line-height:1.4}
  .pd-offer-icon{font-size:20px;margin-bottom:4px}
  .pd-offer-title{font-weight:700;color:var(--red);margin-bottom:2px}
  .pd-tabs{display:flex;gap:0;border-bottom:2px solid var(--gray-mid);margin-bottom:20px;margin-top:32px}
  .pd-tab{padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s;color:var(--gray)}
  .pd-tab.active{color:var(--red);border-bottom-color:var(--red)}
  .pd-spec-table{width:100%;border-collapse:collapse}
  .pd-spec-table tr{border-bottom:1px solid var(--gray-mid)}
  .pd-spec-table td{padding:10px 14px;font-size:14px}
  .pd-spec-table td:first-child{color:var(--gray);width:40%;background:var(--gray-light)}
  .pd-spec-table td:last-child{font-weight:500}
  .pd-why{margin-top:16px}
  .pd-why-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:14px}
  .pd-why-icon{color:var(--red);margin-top:1px;flex-shrink:0}
  .pd-reviews-wrap{display:grid;grid-template-columns:1fr 2fr;gap:24px;margin-top:16px}
  .pd-review-score{text-align:center}
  .pd-review-big{font-family:var(--font-display);font-size:64px;font-weight:700;color:var(--black);line-height:1}
  .pd-review-bar{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13px}
  .bar-track{flex:1;height:6px;background:var(--gray-mid);border-radius:3px;overflow:hidden}

function waLink(product) {

function StarRating({ rating }) {
  const full = Math.floor(rating);
  const half = rating % 1 >= 0.5;
  return (
    <span className="stars">
      {"★".repeat(full)}{half ? "½" : ""}{"☆".repeat(5 - full - (half?1:0))}
    </span>
  );
}

                </div>
                <div className="admin-filters">
                  <div className="admin-search">
                    <input className="admin-search-input" placeholder="Search products by name, brand or SKU..." value={search} onChange={e => setSearch(e.target.value)} />
                    <button className="admin-search-btn">🔍</button>

                  <select className="filter-select"><option>All Categories</option>{CATEGORIES.map(c => <option key={c}>{c}</option>)}</select>
                  <select className="filter-select"><option>All Brands</option>{BRANDS.map(b => <option key={b}>{b}</option>)}</select>

                <div style={{overflowX:"auto"}}>
                  <table>

                      <tr>
                        <th><input type="checkbox" /></th>

                        <th>Brand</th>

                        <th>Stock</th>

                    <tbody>
                      {filtered.map(p => (
                        <tr key={p.id}>
                          <td><input type="checkbox" /></td>

                            <div style={{display:"flex",alignItems:"center",gap:12}}>
                              <div className="prod-img-cell">{p.emoji}</div>
                              <div>
                                <div style={{fontWeight:600,fontSize:14}}>{p.name}</div>
                                <div style={{fontSize:12,color:"var(--gray)"}}>SKU: {p.sku}</div>

// ─── ADD PRODUCT FORM ─────────────────────────────────────────────────────────
function AddProductForm({ onBack }) {
  const [isActive, setIsActive] = useState(true);
  const [isFeatured, setIsFeatured] = useState(false);
  const [isNewArrival, setIsNewArrival] = useState(false);
  const [name, setName] = useState("");
  const [shortDesc, setShortDesc] = useState("");
  const [price, setPrice] = useState("36990");
  const [mrp, setMrp] = useState("42990");
  const [sku, setSku] = useState("AC-LG-15-5S");
  const [stock, setStock] = useState("15");
  const [specs, setSpecs] = useState([{key:"Capacity",val:"1.5 Ton"},{key:"Type",val:"Inverter Split AC"},{key:"Star Rating",val:"5 Star"}]);
  const [saved, setSaved] = useState(false);

  const disc = mrp && price ? Math.round((1 - price/mrp)*100) : 0;

  function addSpec() { setSpecs([...specs,{key:"",val:""}]); }
  function removeSpec(i) { setSpecs(specs.filter((_,idx) => idx !== i)); }

  function handleSave() {
    setSaved(true);
    setTimeout(() => { setSaved(false); onBack(); }, 1500);
  }

  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 280px",gap:20,alignItems:"start"}}>
      <div>
        {/* Basic Info */}
        <div className="form-section">
          <div className="form-section-title">Basic Information</div>
          <div className="form-grid">
            <div className="form-field">
              <label className="form-label">Product Name <span>*</span></label>
              <input className="form-input" value={name} onChange={e => setName(e.target.value)} placeholder="Enter product name" />
            </div>
            <div className="form-field">
              <label className="form-label">Category <span>*</span></label>
              <select className="form-select">
                <option value="">Select category</option>
                {CATEGORIES.map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="form-field">
              <label className="form-label">Brand <span>*</span></label>
              <select className="form-select">
                <option value="">Select brand</option>
                {BRANDS.map(b => <option key={b}>{b}</option>)}
              </select>
            </div>
          </div>
          <div className="form-field" style={{marginBottom:16}}>
            <label className="form-label">Short Description <span>*</span></label>
            <textarea className="form-textarea" rows={2} value={shortDesc} onChange={e => setShortDesc(e.target.value.slice(0,150))} placeholder="Enter short description (Max 150 characters)" />
            <div className="char-count">{shortDesc.length} / 150</div>
          </div>
          <div className="form-field">
            <label className="form-label">Full Description</label>
            <div style={{border:"1px solid var(--gray-mid)",borderRadius:8,overflow:"hidden"}}>
              <div style={{borderBottom:"1px solid var(--gray-mid)",padding:"8px 12px",display:"flex",gap:8,background:"#fafafa"}}>
                {["B","I","U","S","≡","≡","≡","🔗"].map((b,i) => (
                  <button key={i} style={{border:"none",background:"none",cursor:"pointer",padding:"2px 6px",fontWeight:i===0?"700":i===1?"normal":"normal",fontStyle:i===1?"italic":"normal",fontSize:13}}>{b}</button>
                ))}
              </div>
              <textarea className="form-textarea" rows={4} placeholder="Enter product detailed description..." style={{border:"none",borderRadius:"0 0 8px 8px"}} />
            </div>
          </div>
        </div>

        {/* Images */}
        <div className="form-section">
          <div className="form-section-title">Product Images</div>
          <div style={{fontSize:13,color:"var(--gray)",marginBottom:12}}>Upload high quality images of your product</div>
          <div className="upload-area">
            <div className="upload-icon">☁️</div>
            <div className="upload-text"><strong>Click to upload</strong> or drag and drop</div>
            <div className="upload-sub">PNG, JPG, WEBP up to 5MB each</div>
          </div>
          <div className="img-preview-grid">
            {["🌬️","❄️","🔧","📦"].map((e,i) => (
              <div key={i} className={`img-preview-item ${i===0?"main":""}`}>
                <span style={{fontSize:28,marginTop:i===0?16:0}}>{e}</span>
                <button className="img-preview-remove">×</button>
              </div>
            ))}
            <div className="img-add-more">
              <span style={{fontSize:20}}>+</span>
              <span>Add More</span>
            </div>
          </div>
          <div className="img-tip">💡 Tip: First image will be the product main image</div>
        </div>

        {/* Specs */}
        <div className="form-section">
          <div className="form-section-title">Product Specifications</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 32px",gap:8,marginBottom:8}}>
            <div style={{fontSize:12,fontWeight:600,color:"var(--gray)"}}>Specification Name</div>
            <div style={{fontSize:12,fontWeight:600,color:"var(--gray)"}}>Specification Value</div>
            <div></div>
          </div>
          {specs.map((s,i) => (
            <div key={i} className="spec-row">
              <input className="form-input" value={s.key} onChange={e => { const ns=[...specs]; ns[i]={...ns[i],key:e.target.value}; setSpecs(ns); }} placeholder="e.g. Capacity" />
              <input className="form-input" value={s.val} onChange={e => { const ns=[...specs]; ns[i]={...ns[i],val:e.target.value}; setSpecs(ns); }} placeholder="e.g. 1.5 Ton" />
              <button className="del-spec" onClick={() => removeSpec(i)}>🗑️</button>
            </div>
          ))}
          <button className="add-spec-btn" onClick={addSpec}>+ Add Another Specification</button>
        </div>
      </div>

      {/* Right panel */}
      <div>
        <div className="pub-card" style={{top:70}}>
          <div style={{display:"flex",gap:8,marginBottom:20}}>
            <button className="discard-btn" onClick={onBack} style={{flex:1}}>Discard</button>
            <button className="save-btn" onClick={handleSave} style={{flex:2}}>
              {saved ? "✅ Saved!" : "Save Product"}
            </button>
          </div>

          {/* Publication */}
          <div className="pub-section-title">Publication</div>
          <div style={{marginBottom:16}}>
            <div className="toggle-option">
              <div>
                <div className="toggle-label">Active</div>
                <div className="toggle-sublabel">Product will be visible on store</div>
              </div>
              <button className={`toggle ${isActive?"on":""}`} onClick={() => setIsActive(!isActive)} />
            </div>
            <div className="toggle-option">
              <div>
                <div className="toggle-label">Featured Product</div>
                <div className="toggle-sublabel">Show on homepage and listings</div>
              </div>
              <button className={`toggle ${isFeatured?"on":""}`} onClick={() => setIsFeatured(!isFeatured)} />
            </div>
            <div className="toggle-option">
              <div>
                <div className="toggle-label">New Arrival</div>
                <div className="toggle-sublabel">Show in new arrivals section</div>
              </div>
              <button className={`toggle ${isNewArrival?"on":""}`} onClick={() => setIsNewArrival(!isNewArrival)} />
            </div>
          </div>

          {/* Pricing */}
          <div className="pub-section-title">Pricing</div>
          <div className="form-field" style={{marginBottom:10}}>
            <label className="form-label">Selling Price (₹) <span>*</span></label>
            <input className="form-input" value={price} onChange={e => setPrice(e.target.value)} />
          </div>
          <div className="shipping-grid">
            <div className="form-field">
              <label className="form-label">MRP (₹)</label>
              <input className="form-input" value={mrp} onChange={e => setMrp(e.target.value)} />
            </div>
            <div className="form-field">
              <label className="form-label">Discount (₹)</label>
              <input className="form-input" value={mrp && price ? mrp - price : ""} readOnly style={{background:"var(--gray-light)"}} />
            </div>
          </div>
          <div className="form-field" style={{marginBottom:4}}>
            <label className="form-label">Discount (%)</label>
            <input className="form-input" value={disc} readOnly style={{background:"var(--gray-light)"}} />
          </div>
          <div className="pricing-note">Customers will see the selling price. MRP is shown crossed out.</div>

          {/* Inventory */}
          <div className="pub-section-title" style={{marginTop:16}}>Inventory</div>
          <div className="form-field" style={{marginBottom:10}}>
            <label className="form-label">SKU (Stock Keeping Unit) <span>*</span></label>
            <input className="form-input" value={sku} onChange={e => setSku(e.target.value)} />
          </div>
          <div className="form-field" style={{marginBottom:10}}>
            <label className="form-label">Stock Quantity <span>*</span></label>
            <input className="form-input" type="number" value={stock} onChange={e => setStock(e.target.value)} />
          </div>
          <div className="form-field" style={{marginBottom:4}}>
            <label className="form-label">Low Stock Alert</label>
            <input className="form-input" type="number" defaultValue={5} />
          </div>
          <div className="pricing-note">You will be notified when stock reaches this level</div>

          {/* Shipping */}
          <div className="pub-section-title" style={{marginTop:16}}>Shipping & Delivery</div>
          <div className="shipping-grid">
            <div className="form-field">
              <label className="form-label">Delivery Charge</label>
              <select className="form-select">
                <option>Free</option>
                <option>₹199</option>
                <option>₹299</option>
              </select>
            </div>
            <div className="form-field">
              <label className="form-label">Installation Charge</label>
              <select className="form-select">
                <option>Free</option>
                <option>₹499</option>
                <option>₹799</option>
              </select>
            </div>
          </div>
          <div className="form-field">
            <label className="form-label">Estimated Delivery</label>
            <select className="form-select">
              <option>2 – 3 Days</option>
              <option>Same Day</option>
              <option>Next Day</option>
              <option>3 – 5 Days</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  );
}

function SmallFooter() {
  return (
    <div style={{background:"var(--black)",color:"#555",textAlign:"center",padding:"16px",fontSize:12}}>
      © 2025 King Electronics. All Rights Reserved. | Apki Choice. Humari Priority. ❤️
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [orderProduct, setOrderProduct] = useState(null);
  const [adminLoggedIn, setAdminLoggedIn] = useState(false);

  // Scroll to top on page change
  useEffect(() => { window.scrollTo(0, 0); }, [page]);

  if (page === "admin") {
    if (!adminLoggedIn) return <AdminLogin onLogin={() => setAdminLoggedIn(true)} />;
    return <AdminPanel onLogout={() => { setAdminLoggedIn(false); setPage("home"); }} setPage={setPage} />;
  }

  return (
    <div>
      <TopBar />
      <Header page={page} setPage={setPage} />
      {page !== "product" && <Nav setPage={setPage} />}

      <main>
        {page === "home" && <HomePage setPage={setPage} setSelectedProduct={setSelectedProduct} />}
        {page === "products" && <ProductsPage setPage={setPage} setSelectedProduct={setSelectedProduct} />}
        {page === "product" && <ProductDetailPage product={selectedProduct} setPage={setPage} setOrderProduct={setOrderProduct} />}
        {page === "order" && <OrderPage product={orderProduct} setPage={setPage} />}
      </main>

      {page !== "home" && <SmallFooter />}
      <FloatingWA product={selectedProduct} />

      {/* Admin link - bottom corner */}
      <div style={{position:"fixed",bottom:24,left:24,zIndex:998}}>
        <button onClick={() => setPage("admin")} style={{background:"var(--black)",color:"#fff",border:"none",padding:"8px 14px",borderRadius:8,fontSize:12,cursor:"pointer",opacity:.7}}>
          🔐 Admin
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
